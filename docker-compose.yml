version: '3.8'

services:
  # Honeypot service skeleton
  honeypot:
    build:
      context: .
      dockerfile: docker/honeypot.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env

  # Dashboard API & pipeline worker service skeleton
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
